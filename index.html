body{

header{

  font-size:28px;

.nav{
  display:flex;
  gap:20px;
  color:#aaa;
}

.container{
  padding:20px;
}

.topbar{
  display:flex;
  gap:15px;
  margin-bottom:25px;
  flex-wrap:wrap;
}

.search{
  flex:1;
  min-width:200px;
  padding:12px;
  border:none;

.filter{
  padding:12px;

  border-radius:10px;
  background:#141b2d;
  color:white;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
  margin-bottom:30px;
}

.stat-card{
  background:#141b2d;
  padding:20px;
  border-radius:12px;
  border:1px solid #1f2937;
}

.stat-title{
  color:#aaa;
  margin-bottom:8px;
}

.stat-value{
  font-size:28px;
  font-weight:bold;
}

.players-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:15px;
}

.player-card{
  background:#141b2d;
  padding:18px;
  border-radius:12px;
  border:1px solid #1f2937;
  transition:0.2s;
  cursor:pointer;
}

.player-card:hover{
  transform:translateY(-3px);
}

.player-name{
  font-size:22px;
  font-weight:bold;

.player-club{

.tag{

.value{

  color:#4ade80;
}

.modal{
  position:fixed;
  inset:0;

  display:none;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.modal-content{
  background:#111827;
  width:100%;
  max-width:800px;
  border-radius:15px;
  padding:25px;
}

.close{
  float:right;
  cursor:pointer;
  font-size:28px;
}

.profile-stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;
  margin-top:20px;
}

.profile-stat{
  background:#1f2937;
  padding:15px;
  border-radius:10px;
}

.ai-box{
  margin-top:25px;
  background:#0f172a;
  padding:20px;
  border-radius:12px;
  border:1px solid #2563eb;
}

.ai-title{
  margin-bottom:10px;
  color:#60a5fa;
}

.leaderboard{
  margin-top:40px;
}

.table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

.table th,
.table td{
  padding:12px;
  border-bottom:1px solid #1f2937;
  text-align:left;
}

.table tr:hover{
  background:#141b2d;
}

<script>
const players = [

},
{

const grid = document.getElementById("playersGrid");
const leaderboard = document.getElementById("leaderboardBody");
const search = document.getElementById("search");
const positionFilter = document.getElementById("positionFilter");
const modal = document.getElementById("modal");
const profile = document.getElementById("profile");

function render(list){
  grid.innerHTML = "";

  list.forEach(p => {
    const div = document.createElement("div");

    div.className = "player-card";

    div.innerHTML = `
      <div class="player-name">${p.name}</div>
      <div class="player-club">${p.club}</div>

      <div>${p.position} • ${p.age} years • ${p.country}</div>

      <div class="tags">
        <div class="tag">Scout ${p.scout}</div>
        <div class="tag">${p.potential}</div>
      </div>

      <div class="value">€${p.value}M</div>
    `;

    div.onclick = () => openPlayer(p);

    grid.appendChild(div);
  });
}

function renderLeaderboard(){
  leaderboard.innerHTML = "";

  [...players]
    .sort((a,b) => b.scout - a.scout)
    .forEach(p => {
      leaderboard.innerHTML += `
        <tr>
          <td>${p.name}</td>
          <td>${p.club}</td>
          <td>${p.scout}</td>
        </tr>
      `;
    });
}

function openPlayer(p){
  modal.style.display = "flex";

  profile.innerHTML = `
    <h1>${p.name}</h1>

    <p style="margin-top:5px;color:#aaa">
      ${p.club} • ${p.position}
    </p>

    <div class="profile-stats">

      <div class="profile-stat">
        ⚽ Goals
        <h2>${p.goals}</h2>
      </div>

      <div class="profile-stat">
        🎯 Assists
        <h2>${p.assists}</h2>
      </div>

      <div class="profile-stat">
        📈 xG
        <h2>${p.xg}</h2>
      </div>

      <div class="profile-stat">
        ⏱ Minutes
        <h2>${p.minutes}</h2>
      </div>

      <div class="profile-stat">
        💰 Value
        <h2>€${p.value}M</h2>
      </div>

      <div class="profile-stat">
        🧠 Scout
        <h2>${p.scout}</h2>
      </div>

    </div>

    <div class="ai-box">

      <div class="ai-title">
        AI Scout Analysis
      </div>

      <p>
        ${p.name} profiles as a
        high-upside ${p.style.toLowerCase()}
        with elite long-term development potential.
      </p>

      <br/>

      <p>
        Potential: <b>${p.potential}</b>
      </p>

      <br/>

      <p>
        Recommended for Champions League level clubs.
      </p>

    </div>
  `;
}

function closeModal(){
  modal.style.display = "none";
}

function applyFilters(){
  const searchValue = search.value.toLowerCase();
  const positionValue = positionFilter.value;

  const filtered = players.filter(p => {

    const matchesSearch =
      p.name.toLowerCase().includes(searchValue) ||
      p.club.toLowerCase().includes(searchValue) ||
      p.country.toLowerCase().includes(searchValue);

    const matchesPosition =
      !positionValue ||
      p.position === positionValue;

    return matchesSearch && matchesPosition;
  });

  render(filtered);
}

search.oninput = applyFilters;
positionFilter.onchange = applyFilters;

render(players);
renderLeaderboard();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ScoutAI</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0b0f19;
      color: white;
    }

    header {
      padding: 20px;
      font-size: 28px;
      font-weight: bold;
      background: #111827;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 15px;
      padding: 20px;
    }

    .card {
      background: #141b2d;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #222;
    }

    .name {
      font-size: 18px;
      font-weight: bold;
    }

    button {
      margin-top: 10px;
      padding: 8px;
      background: #2d6cdf;
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <header>⚽ ScoutAI - Transfer Market</header>

  <div class="grid" id="players"></div>

  <script>
    const players = [
      { name: "Jude Bellingham", club: "Real Madrid", age: 21, value: 180 },
      { name: "Jamal Musiala", club: "Bayern", age: 21, value: 120 },
      { name: "Pedri", club: "Barcelona", age: 22, value: 100 }
    ];

    const container = document.getElementById("players");

    players.forEach(p => {
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `
        <div class="name">${p.name}</div>
        <div>Club: ${p.club}</div>
        <div>Age: ${p.age}</div>
        <div>Value: €${p.value}M</div>
        <button onclick="alert('AI Scout Score coming soon')">
          AI Scout Score
        </button>
      `;
      container.appendChild(div);
    });
  </script>
</body>
</html>
